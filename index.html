<script>
const track=document.getElementById('track');
const prev=document.querySelector('.prev');
const next=document.querySelector('.next');
if(track){
  let cards=[...track.children], x=0, paused=false, last=performance.now(), speed=.30;
  track.addEventListener('mouseenter',()=>paused=true);
  track.addEventListener('mouseleave',()=>paused=false);
  function stepSize(el){return el.getBoundingClientRect().width+9}
  function animate(now){
    const dt=Math.min(40,now-last); last=now;
    if(!paused){
      x+=speed*dt/16.67;
      const lastCard=cards[cards.length-1], step=stepSize(lastCard);
      if(x>=step){track.insertBefore(lastCard,track.firstElementChild);cards.unshift(lastCard);cards.pop();x-=step}
      track.style.transform=`translate3d(${x}px,0,0)`;
    }
    requestAnimationFrame(animate);
  }
  prev.onclick=()=>{const lastCard=cards[cards.length-1],step=stepSize(lastCard);track.insertBefore(lastCard,track.firstElementChild);cards.unshift(lastCard);cards.pop();x+=step};
  next.onclick=()=>{const first=cards.shift(),step=stepSize(first);cards.push(first);track.appendChild(first);x-=step};
  requestAnimationFrame(animate);
}

const mobileMenuBtn=document.getElementById('mobileMenuBtn');
const mobileMenuPanel=document.getElementById('mobileMenuPanel');
const mobileMenuClose=document.getElementById('mobileMenuClose');
function setMobileMenu(open){
  if(!mobileMenuPanel||!mobileMenuBtn) return;
  mobileMenuPanel.classList.toggle('open',open);
  mobileMenuPanel.setAttribute('aria-hidden',String(!open));
  mobileMenuBtn.setAttribute('aria-expanded',String(open));
}
if(mobileMenuBtn){ mobileMenuBtn.addEventListener('click',()=>setMobileMenu(true)); }
if(mobileMenuClose){ mobileMenuClose.addEventListener('click',()=>setMobileMenu(false)); }
if(mobileMenuPanel){ mobileMenuPanel.addEventListener('click',(e)=>{ if(e.target===mobileMenuPanel) setMobileMenu(false); }); }
document.addEventListener('click',(e)=>{ if(mobileMenuPanel?.classList.contains('open') && !mobileMenuPanel.contains(e.target) && e.target!==mobileMenuBtn){ setMobileMenu(false); }});

const mtrack=document.getElementById('mtrack');
const mprev=document.querySelector('.mprev');
const mnext=document.querySelector('.mnext');
if(mtrack){
  let mx=0, mpaused=false, mlast=performance.now();
  const getStep=()=>{
    const first=mtrack.firstElementChild;
    if(!first) return 155;
    return first.getBoundingClientRect().width + 10;
  };
  mtrack.addEventListener('touchstart',()=>mpaused=true,{passive:true});
  mtrack.addEventListener('touchend',()=>mpaused=false,{passive:true});
  mtrack.addEventListener('mouseenter',()=>mpaused=true);
  mtrack.addEventListener('mouseleave',()=>mpaused=false);
  function ma(now){
    const dt=Math.min(50,now-mlast); mlast=now;
    if(!mpaused){
      mx -= 0.9 * dt / 16.67;
      const step=getStep();
      if(Math.abs(mx)>=step){
        const first=mtrack.firstElementChild;
        mtrack.appendChild(first);
        mx += step;
      }
      mtrack.style.transform=`translate3d(${mx}px,0,0)`;
    }
    requestAnimationFrame(ma);
  }
  mprev.addEventListener('click',()=>{
    const last=mtrack.lastElementChild, step=getStep();
    mtrack.insertBefore(last,mtrack.firstElementChild);
    mx -= step;
    mtrack.style.transform=`translate3d(${mx}px,0,0)`;
  });
  mnext.addEventListener('click',()=>{
    const first=mtrack.firstElementChild, step=getStep();
    mtrack.appendChild(first);
    mx += step;
    mtrack.style.transform=`translate3d(${mx}px,0,0)`;
  });
  requestAnimationFrame(ma);
}
</script>
